name: Technical Data Warehouse Bot

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 08:00 Vietnam time (UTC+7), every Monday
    - cron: '0 1 * * 1'

concurrency:
  group: technical-data-warehouse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$DRIVE_FOLDER_ID"
          test -n "$SERVICE_ACCOUNT_JSON"

      - name: Run technical data warehouse
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-3.8-flash' }}
          TARGET_TAGS: ${{ secrets.TARGET_TAGS }}
          MAX_RETRIES: '3'
          MAX_TEXT_CHARS: '400000'
          SLEEP_BETWEEN_FILES: '1'
          FORCE_REPROCESS: 'false'
          LOG_LEVEL: INFO
        run: python main_bot.py
