name: Auto Crawl KHLCNT

on:
  schedule:
    # Chạy tự động lúc 06:15 sáng và 20:45 tối giờ Việt Nam (23:15 và 13:45 UTC)
    - cron: '15 23 * * *'
    - cron: '45 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crawl-khlcnt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lấy mốc thời gian lần chạy tự động (schedule) thành công gần nhất
        id: get_last_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/auto_run.yml/runs?event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          echo "last_run=$LAST_RUN" >> $GITHUB_OUTPUT
          echo "Mốc lịch chạy tự động KHLCNT thành công gần nhất: $LAST_RUN"

      - name: Run Bot KHLCNT (Bước 1 - Quét & Phân tích AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          LAST_RUN_TIMESTAMP: ${{ steps.get_last_run.outputs.last_run }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main_bot.py

      - name: Sync to Google Sheets (Bước 2 - Ghi dữ liệu mới không trùng)
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python sync_to_gsheet.py KHLCNT
